spring.application.name=gestionvet

# Si la base de datos no existe, la crea (Flyway arma las tablas).
spring.datasource.url=jdbc:mysql://localhost:3306/vet_san_marcos?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# JWT (la clave debe tener al menos 32 caracteres; expiración en milisegundos = 1 hora)
jwt.secret=vet-san-marcos-clave-secreta-para-jwt-2026-no-subir-a-git
jwt.expiration=3600000
